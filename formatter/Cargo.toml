[package]
name = "pdftoolsxc-formatter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
